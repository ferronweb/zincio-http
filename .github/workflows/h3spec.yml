name: h3spec

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  H3SPEC_VERSION: "0.1.13"

jobs:
  h3spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install h3spec
        run: |
          mkdir -p h3spec
          curl -fsSL -o h3spec/h3spec \
            "https://github.com/kazu-yamamoto/h3spec/releases/download/v${H3SPEC_VERSION}/h3spec-linux-x86_64"
          chmod +x h3spec/h3spec
          ./h3spec/h3spec --version

      - name: Run h3spec conformance
        run: bash scripts/h3spec.sh
