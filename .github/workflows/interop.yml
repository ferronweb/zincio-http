name: Interop

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  ZINCIO_INTEROP_REQUIRE: "1"

jobs:
  interop:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: interop
      - uses: docker/setup-buildx-action@v4

      # Built here so to cache the images, and so the build errors would fail clearly
      - name: Build Docker images
        working-directory: interop
        run: chmod +x build-docker.sh && ./build-docker.sh --cache-from type=gha --cache-to type=gha,mode=max

      - name: Run interop matrix
        working-directory: interop
        run: cargo test -- --nocapture

      - name: Upload driver logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: interop-logs
          path: interop/target/debug/../*.log
          if-no-files-found: ignore
