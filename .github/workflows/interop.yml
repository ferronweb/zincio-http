name: Interop

# Drives real third-party HTTP clients against the native server from
# containers. See ../interop/README.md for what this buys and why.
#
# Every scenario runs on every pull request, as decided: the cheap clients build
# their image in seconds, and a regression that only shows up against a real
# client should not be able to sit on `main` for a day.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  # The suite skips itself when Docker is unreachable, which is convenient for
  # contributors but must not hide a broken runner here.
  ZINCIO_INTEROP_REQUIRE: "1"

jobs:
  interop:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: interop
      - uses: docker/setup-buildx-action@v4

      # Built here so the images are warm before the tests start, and so a
      # broken Dockerfile fails with a clear message instead of surfacing as a
      # matrix full of container-start failures. Tags must match the ones in
      # interop/src/clients.rs, whose `docker build` then hits a warm cache.
      # The GitHub Actions cache keeps the expensive HTTP/3 source build from
      # running on every pull request.
      - name: Build curl image (HTTP/1.1 + HTTP/2)
        uses: docker/build-push-action@v6
        with:
          context: interop
          file: interop/docker/curl/Dockerfile
          target: driver
          tags: zincio-http-interop-curl:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build curl-http3 image
        uses: docker/build-push-action@v6
        with:
          context: interop
          file: interop/docker/curl/Dockerfile
          target: http3
          tags: zincio-http-interop-curl-http3:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Go image
        uses: docker/build-push-action@v6
        with:
          context: interop
          file: interop/docker/go/Dockerfile
          target: driver
          tags: zincio-http-interop-go:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Node image
        uses: docker/build-push-action@v6
        with:
          context: interop
          file: interop/docker/node/Dockerfile
          target: driver
          tags: zincio-http-interop-node:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build quic-go image (HTTP/3)
        uses: docker/build-push-action@v6
        with:
          context: interop
          file: interop/docker/quic-go/Dockerfile
          target: driver
          tags: zincio-http-interop-quic-go:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build OkHttp image
        uses: docker/build-push-action@v6
        with:
          context: interop
          file: interop/docker/okhttp/Dockerfile
          target: driver
          tags: zincio-http-interop-okhttp:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build python-h2 image
        uses: docker/build-push-action@v6
        with:
          context: interop
          file: interop/docker/python-h2/Dockerfile
          target: driver
          tags: zincio-http-interop-python-h2:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build aioquic image (HTTP/3)
        uses: docker/build-push-action@v6
        with:
          context: interop
          file: interop/docker/aioquic/Dockerfile
          target: driver
          tags: zincio-http-interop-aioquic:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run interop matrix
        working-directory: interop
        run: cargo test -- --nocapture

      - name: Upload driver logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: interop-logs
          path: interop/target/debug/../*.log
          if-no-files-found: ignore
