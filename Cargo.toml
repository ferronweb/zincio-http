[package]
name = "zincio-http"
version = "0.4.6"
edition = "2021"
authors = ["Dorian Niemiec <dorian@ferron.sh>"]
description = "High-performance HTTP server primitives for the `zincio` runtime"
license = "MIT"
readme = "README.md"
keywords = ["async", "http", "server", "quic"]
categories = ["network-programming", "web-programming"]
documentation = "https://docs.rs/zincio-http"
repository = "https://github.com/ferronweb/zincio-http"

[dependencies]
bytes = "1.11.1"
futures-util = "0.3.32"
http = "1.4.0"
http-body = "1.0.1"
http-body-util = "0.1.3"
kanal = "0.1.1"
oneshot = { version = "0.2.1", features = ["async", "std"] }
pin-project-lite = { version = "0.2.16", optional = true }
send_wrapper = "0.6.0"
parking_lot = "0.12.5"
tokio = { version = "1.50.0", features = ["sync", "parking_lot"] }
zincio = { version = "0.2.22", default-features = false, features = ["time"] }

# HTTP/1.x
httparse = { version = "1.10.1", optional = true }
httpdate = { version = "1.0.3", optional = true }
memchr = { version = "2.8.0", optional = true }
tokio-util = { version = "0.7.18", optional = true }

# HTTP/2
rustc-hash = "2.1.3"
smallvec = "1.15"

# HTTP/3
quinn = { version = "0.11", default-features = false, optional = true }

# Static-table perfect hashing.
phf = { version = "0.14", features = ["macros"] }
futures-executor = "0.3.34"

[dev-dependencies]
tokio = { version = "1.50.0", features = ["test-util", "full"] }
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
serde_json = "1"
criterion = "0.8"
rcgen = "0.14"
quinn = "0.11"

[[bench]]
name = "h2_hpack"
required-features = ["h2"]
harness = false

[[bench]]
name = "h3_qpack"
required-features = ["h3"]
harness = false

[[bench]]
name = "h2_hpack_large"
required-features = ["h2"]
harness = false

[[bench]]
name = "h3_qpack_large"
required-features = ["h3"]
harness = false

[features]
default = ["h1", "h1-zerocopy", "h2"]
h1 = ["httparse", "httpdate", "memchr", "tokio-util"]
h1-zerocopy = ["h1", "zincio/splice"]
h2 = ["httpdate", "tokio-util", "pin-project-lite"]
h3 = ["httpdate", "tokio-util"]
h3-quinn = ["h3", "dep:quinn"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
