[package]
name = "zincio-http-interop"
version = "0.0.0"
publish = false
edition = "2021"

# This crate is deliberately outside the main workspace: it pulls in
# `testcontainers` and a large client-side dependency tree that has no
# business in the published crate's build. It depends on the library by
# path, exactly like `fuzz/`, which gives it its own `Cargo.lock` and
# `target/`.

[dependencies]
bytes = "1"
futures-util = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
quinn = "0.11"
rcgen = "0.14"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
zincio = { version = "0.2.22", default-features = false, features = ["time"] }
zincio-http = { path = "..", features = ["h1", "h2", "h3", "h3-quinn"] }

[dev-dependencies]
# Pinned: `h2` and `h3` are reference client implementations, useful as an
# in-process smoke test that the scenario server is internally consistent
# before any container is involved.
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"

[[bin]]
name = "interop-server"
path = "src/bin/interop-server.rs"
